<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>galaxypron Settings</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #171717; color: #fff; }
        h1 { color: #10a37f; }
        label { display: block; margin: 20px 0; }
        span { display: block; margin-bottom: 6px; color: #999; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #242424; color: #fff; }
        button { padding: 12px 24px; background: #10a37f; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .saved { color: #10a37f; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🪐 galaxypron Settings</h1>
    <label>
        <span>Server URL</span>
        <input type="text" id="server-url" placeholder="http://localhost:5000" />
    </label>
    <button id="save">Save</button>
    <p class="saved" id="saved-msg" style="display:none">Settings saved!</p>
    <script src="options.js"></script>
</body>
</html>
